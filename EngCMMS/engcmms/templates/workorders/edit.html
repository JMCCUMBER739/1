{% extends "base.html" %}
{% block title %}{{ 'Edit' if wo else 'New' }} Work Order{% endblock %}
{% block heading %}{{ 'Edit Work Order ' ~ wo.number if wo else 'New Work Order' }}{% endblock %}
{% block content %}
<div class="card" style="max-width:880px">
<form method="post">
  <div class="form-grid">
    <div class="field full"><label>Title *</label><input name="title" value="{{ wo.title if wo else '' }}" required></div>
    <div class="field full"><label>Description</label><textarea name="description">{{ wo.description if wo else '' }}</textarea></div>
    <div class="field"><label>Type</label><select name="wo_type">{% for t in types %}<option value="{{ t }}" {{ 'selected' if wo and wo.wo_type==t }}>{{ t }}</option>{% endfor %}</select></div>
    <div class="field"><label>Priority</label><select name="priority">{% for p in priorities %}<option value="{{ p }}" {{ 'selected' if wo and wo.priority==p else ('selected' if not wo and p=='medium') }}>{{ p }}</option>{% endfor %}</select></div>
    <div class="field"><label>Status</label><select name="status">{% for s in statuses %}<option value="{{ s }}" {{ 'selected' if wo and wo.status==s else ('selected' if not wo and s=='open') }}>{{ s }}</option>{% endfor %}</select></div>
    <div class="field"><label>Asset</label><select name="asset_id"><option value="">—</option>{% for a in assets %}<option value="{{ a.id }}" {{ 'selected' if wo and wo.asset_id==a.id }}>{{ a.tag }} — {{ a.name }}</option>{% endfor %}</select></div>
    <div class="field"><label>Assignee</label><select name="assignee_id"><option value="">Unassigned</option>{% for u in users %}<option value="{{ u.id }}" {{ 'selected' if wo and wo.assignee_id==u.id }}>{{ u.full_name }} ({{ u.discipline }})</option>{% endfor %}</select></div>
    <div class="field"><label>Requested by</label><input name="requested_by" value="{{ wo.requested_by if wo else '' }}"></div>
    <div class="field"><label>Due date</label><input type="datetime-local" name="due_date" value="{{ wo.due_date.strftime('%Y-%m-%dT%H:%M') if wo and wo.due_date else '' }}"></div>
    <div class="field"><label>Failure code</label><input name="failure_code" value="{{ wo.failure_code if wo else '' }}"></div>
  </div>
  <hr style="border:none;border-top:1px solid var(--line);margin:.5rem 0 1rem">
  <div class="form-grid">
    <div class="field"><label>Labor hours</label><input type="number" step="0.1" name="labor_hours" value="{{ wo.labor_hours if wo else 0 }}"></div>
    <div class="field"><label>Downtime hours</label><input type="number" step="0.1" name="downtime_hours" value="{{ wo.downtime_hours if wo else 0 }}"></div>
    <div class="field"><label>Parts cost</label><input type="number" step="0.01" name="cost_parts" value="{{ wo.cost_parts if wo else 0 }}"></div>
    <div class="field"><label>Labor cost</label><input type="number" step="0.01" name="cost_labor" value="{{ wo.cost_labor if wo else 0 }}"></div>
    <div class="field full"><label>Resolution notes</label><textarea name="resolution">{{ wo.resolution if wo else '' }}</textarea></div>
  </div>
  <div class="field check"><input type="checkbox" id="notify" name="notify" checked><label for="notify" style="margin:0">Email the assignee &amp; subscribers on save</label></div>
  <div class="btn-row"><button class="btn">Save Work Order</button><a class="btn btn-ghost" href="{{ url_for('workorders.list_workorders') }}">Cancel</a></div>
</form>
</div>
{% endblock %}
