{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block heading %}Error {{ code }}{% endblock %}
{% block fullpage %}
<div class="login-wrap">
  <div class="login-card" style="text-align:center">
    <div class="login-logo">⚠</div>
    <h1>Error {{ code }}</h1>
    <p class="muted">{{ message }}</p>
    <a class="btn" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>
  </div>
</div>
{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;text-align:center">
  <h2 style="font-size:2.5rem;margin:0">{{ code }}</h2>
  <p class="muted">{{ message }}</p>
  <a class="btn" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>
</div>
{% endblock %}
