{% extends "base.html" %}
{% block title %}{{ 'Edit' if pm else 'New' }} PM{% endblock %}
{% block heading %}{{ 'Edit PM Schedule' if pm else 'New PM Schedule' }}{% endblock %}
{% block content %}
<div class="card" style="max-width:760px">
<form method="post">
  <div class="field"><label>Title *</label><input name="title" value="{{ pm.title if pm else '' }}" required></div>
  <div class="field"><label>Description / checklist</label><textarea name="description">{{ pm.description if pm else '' }}</textarea></div>
  <div class="form-grid">
    <div class="field"><label>Asset</label><select name="asset_id"><option value="">—</option>{% for a in assets %}<option value="{{ a.id }}" {{ 'selected' if pm and pm.asset_id==a.id }}>{{ a.tag }} — {{ a.name }}</option>{% endfor %}</select></div>
    <div class="field"><label>Assignee</label><select name="assignee_id"><option value="">—</option>{% for u in users %}<option value="{{ u.id }}" {{ 'selected' if pm and pm.assignee_id==u.id }}>{{ u.full_name }}</option>{% endfor %}</select></div>
    <div class="field"><label>Frequency (days)</label><input type="number" name="frequency_days" value="{{ pm.frequency_days if pm else 30 }}"></div>
    <div class="field"><label>Priority</label><select name="priority">{% for p in priorities %}<option value="{{ p }}" {{ 'selected' if pm and pm.priority==p else ('selected' if not pm and p=='medium') }}>{{ p }}</option>{% endfor %}</select></div>
    <div class="field"><label>Estimated hours</label><input type="number" step="0.1" name="estimated_hours" value="{{ pm.estimated_hours if pm else 1 }}"></div>
    <div class="field"><label>Next due</label><input type="date" name="next_due" value="{{ pm.next_due if pm and pm.next_due else '' }}"></div>
  </div>
  <div class="field check"><input type="checkbox" id="active" name="active" {{ 'checked' if not pm or pm.active }}><label for="active" style="margin:0">Active</label></div>
  <div class="btn-row"><button class="btn">Save</button><a class="btn btn-ghost" href="{{ url_for('pm.list_pm') }}">Cancel</a></div>
</form>
</div>
{% endblock %}
