{% extends "base.html" %}
{% block title %}{{ 'Edit' if project else 'New' }} Project{% endblock %}
{% block heading %}{{ 'Edit Project' if project else 'New Project' }}{% endblock %}
{% block content %}
<div class="card" style="max-width:880px">
<form method="post">
  <div class="form-grid">
    <div class="field"><label>Code</label><input name="code" value="{{ project.code if project else '' }}" placeholder="DX-101"></div>
    <div class="field"><label>Name *</label><input name="name" value="{{ project.name if project else '' }}" required></div>
    <div class="field"><label>Type</label><select name="project_type">{% for t in types %}<option value="{{ t }}" {{ 'selected' if project and project.project_type==t }}>{{ t }}</option>{% endfor %}</select></div>
    <div class="field"><label>Discipline</label><select name="discipline">{% for d in disciplines %}<option value="{{ d }}" {{ 'selected' if project and project.discipline==d }}>{{ d }}</option>{% endfor %}</select></div>
    <div class="field"><label>Status</label><select name="status">{% for s in statuses %}<option value="{{ s }}" {{ 'selected' if project and project.status==s }}>{{ s }}</option>{% endfor %}</select></div>
    <div class="field"><label>Health</label><select name="health">{% for h in healths %}<option value="{{ h }}" {{ 'selected' if project and project.health==h }}>{{ h }}</option>{% endfor %}</select></div>
    <div class="field"><label>Lead</label><select name="lead_id"><option value="">—</option>{% for u in users %}<option value="{{ u.id }}" {{ 'selected' if project and project.lead_id==u.id }}>{{ u.full_name }}</option>{% endfor %}</select></div>
    <div class="field"><label>% Complete</label><input type="number" name="percent_complete" min="0" max="100" value="{{ project.percent_complete if project else 0 }}"></div>
    <div class="field"><label>Budget</label><input type="number" step="0.01" name="budget" value="{{ project.budget if project else 0 }}"></div>
    <div class="field"><label>Spent</label><input type="number" step="0.01" name="spent" value="{{ project.spent if project else 0 }}"></div>
    <div class="field"><label>Start date</label><input type="date" name="start_date" value="{{ project.start_date if project and project.start_date else '' }}"></div>
    <div class="field"><label>Target date</label><input type="date" name="target_date" value="{{ project.target_date if project and project.target_date else '' }}"></div>
    <div class="field full"><label>Description</label><textarea name="description">{{ project.description if project else '' }}</textarea></div>
  </div>
  <div class="btn-row"><button class="btn">Save Project</button><a class="btn btn-ghost" href="{{ url_for('projects.list_projects') }}">Cancel</a></div>
</form>
</div>
{% endblock %}
