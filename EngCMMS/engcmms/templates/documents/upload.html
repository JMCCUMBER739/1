{% extends "base.html" %}
{% block title %}Upload Document{% endblock %}
{% block heading %}Upload Document{% endblock %}
{% block content %}
<div class="card" style="max-width:760px">
<form method="post" enctype="multipart/form-data">
  <div class="field"><label>File *</label><input type="file" name="file" required></div>
  <div class="form-grid">
    <div class="field"><label>Title</label><input name="title" placeholder="Defaults to filename"></div>
    <div class="field"><label>Category</label><select name="category">{% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
    <div class="field"><label>Revision</label><input name="revision" placeholder="e.g. Rev C"></div>
    <div class="field full"><label>Description</label><textarea name="description"></textarea></div>
    <div class="field"><label>Link to asset</label><select name="asset_id"><option value="">—</option>{% for a in assets %}<option value="{{ a.id }}" {{ 'selected' if preselect_asset==a.id }}>{{ a.tag }} — {{ a.name }}</option>{% endfor %}</select></div>
    <div class="field"><label>Link to work order</label><select name="workorder_id"><option value="">—</option>{% for w in workorders %}<option value="{{ w.id }}" {{ 'selected' if preselect_workorder==w.id }}>{{ w.number }} — {{ w.title }}</option>{% endfor %}</select></div>
    <div class="field"><label>Link to project</label><select name="project_id"><option value="">—</option>{% for p in projects %}<option value="{{ p.id }}" {{ 'selected' if preselect_project==p.id }}>{{ p.code }} — {{ p.name }}</option>{% endfor %}</select></div>
  </div>
  <div class="btn-row"><button class="btn">Upload</button><a class="btn btn-ghost" href="{{ url_for('documents.list_documents') }}">Cancel</a></div>
</form>
</div>
{% endblock %}
