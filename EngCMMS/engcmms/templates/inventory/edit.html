{% extends "base.html" %}
{% block title %}{{ 'Edit' if part else 'New' }} Part{% endblock %}
{% block heading %}{{ 'Edit Part' if part else 'New Part' }}{% endblock %}
{% block content %}
<div class="card" style="max-width:760px">
<form method="post">
  <div class="form-grid">
    <div class="field"><label>Part number *</label><input name="part_number" value="{{ part.part_number if part else '' }}" required></div>
    <div class="field"><label>Name *</label><input name="name" value="{{ part.name if part else '' }}" required></div>
    <div class="field"><label>Category</label><input name="category" value="{{ part.category if part else '' }}"></div>
    <div class="field"><label>Vendor</label><input name="vendor" value="{{ part.vendor if part else '' }}"></div>
    <div class="field"><label>Quantity</label><input type="number" name="quantity" value="{{ part.quantity if part else 0 }}"></div>
    <div class="field"><label>Reorder point</label><input type="number" name="reorder_point" value="{{ part.reorder_point if part else 0 }}"></div>
    <div class="field"><label>Unit cost</label><input type="number" step="0.01" name="unit_cost" value="{{ part.unit_cost if part else 0 }}"></div>
    <div class="field"><label>Storage location</label><input name="location" value="{{ part.location if part else '' }}"></div>
    <div class="field full"><label>Description</label><textarea name="description">{{ part.description if part else '' }}</textarea></div>
  </div>
  <div class="btn-row"><button class="btn">Save</button><a class="btn btn-ghost" href="{{ url_for('inventory.list_parts') }}">Cancel</a></div>
</form>
</div>
{% endblock %}
