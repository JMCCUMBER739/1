[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palimpsest"
version = "1.0.0"
description = "Production book restoration & intelligence studio for scanned PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Palimpsest" }]
dependencies = [
  "streamlit>=1.32.0",
  "pymupdf>=1.24.0",
  "Pillow>=10.2.0",
  "opencv-python-headless>=4.9.0",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "plotly>=5.18.0",
  "deep-translator>=1.11.4",
  "langdetect>=1.0.9",
  "reportlab>=4.1.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "rich>=13.7.0",
  "scikit-image>=0.22.0",
  "scipy>=1.12.0",
  "wordcloud>=1.9.3",
  "altair>=5.2.0",
  "pytesseract>=0.3.10",
  "python-dotenv>=1.0.0",
  "tqdm>=4.66.0",
  "jinja2>=3.1.3",
  "markdown>=3.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
palimpsest = "run_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
